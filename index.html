<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Tinnsi Bakery 商品型錄，提供分類瀏覽、商品詳情與可快速更新的品牌展示頁。"
    >
    <title>Tinnsi Bakery</title>
    <link rel="stylesheet" href="./assets/styles/site.css">
  </head>
  <body>
    <div class="site-shell">
      <header class="hero">
        <div class="hero-copy">
          <p class="eyebrow">CURATED COLLECTION</p>
          <h1 id="site-title">Tinnsi Bakery</h1>
          <p id="site-tagline" class="hero-tagline">
            以溫暖色調與清楚的商品分類，整理出適合展示與分享的前台型錄。
          </p>
          <div class="hero-actions">
            <a class="button button-primary" href="#catalog">立即看產品</a>
          </div>
        </div>
      </header>

      <main class="main-layout" id="catalog">
        <aside class="category-panel" id="category-panel">
          <div class="category-panel-header">
            <div>
              <p class="eyebrow">CATEGORIES</p>
              <h2 id="category-nav-title">商品分類</h2>
            </div>
            <button
              id="category-toggle"
              class="sidebar-toggle"
              type="button"
              aria-expanded="false"
              aria-controls="category-nav"
            >
              展開分類
            </button>
          </div>
          <nav id="category-nav" class="category-nav" aria-labelledby="category-nav-title"></nav>
        </aside>

        <section class="catalog-panel">
          <div class="section-heading">
            <div>
              <p class="eyebrow">PRODUCTS</p>
              <h2>商品總覽</h2>
            </div>
          </div>

          <div class="toolbar">
            <label class="search-box">
              <span class="sr-only">搜尋產品</span>
              <input id="search-input" type="search" placeholder="搜尋產品名稱、分類或 SKU">
            </label>
            <div id="category-filters" class="category-filters" aria-label="目前篩選"></div>
          </div>

          <div id="catalog-feedback" class="feedback" aria-live="polite">正在載入商品資料...</div>
          <div id="product-grid" class="product-grid"></div>
        </section>

        <aside class="detail-panel">
          <div id="detail-empty" class="detail-empty">
            <p class="eyebrow">DETAIL</p>
            <h2>選擇一項商品</h2>
            <p>從左側分類或商品卡中挑選一項，即可查看圖片、規格與下單連結。</p>
          </div>

          <article id="product-detail" class="product-detail" hidden>
            <div class="detail-image-wrap">
              <img id="detail-image" src="" alt="">
            </div>

            <div class="detail-copy">
              <div class="detail-header">
                <div>
                  <p id="detail-category" class="detail-category"></p>
                  <h2 id="detail-name"></h2>
                </div>
                <p id="detail-price" class="detail-price"></p>
              </div>

              <p id="detail-subtitle" class="detail-subtitle"></p>
              <p id="detail-summary" class="detail-summary"></p>

              <div class="detail-actions">
                <a id="detail-order-link" class="button button-primary" href="#" target="_blank" rel="noreferrer">
                  前往下單
                </a>
              </div>

              <section>
                <h3>商品圖片</h3>
                <div id="detail-gallery" class="detail-gallery"></div>
              </section>

              <section>
                <h3>商品介紹</h3>
                <div id="detail-sections" class="accordion-list"></div>
              </section>
            </div>
          </article>
        </aside>
      </main>

      <footer class="site-footer">
        <p id="site-contact">聯絡我們：hello@tinnsi.example</p>
        <div id="site-social-links" class="social-links" aria-label="社群連結"></div>
      </footer>
    </div>

    <script src="./assets/scripts/site.js" type="module"></script>
  </body>
</html>
