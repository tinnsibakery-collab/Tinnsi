<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">保溫瓶示意圖</title>
  <desc id="desc">暖色調背景中的保溫瓶產品插圖。</desc>
  <defs>
    <linearGradient id="bg" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#f6e9db"/>
      <stop offset="100%" stop-color="#ead0b1"/>
    </linearGradient>
    <linearGradient id="bottle" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#fdfdfd"/>
      <stop offset="100%" stop-color="#dad6cf"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <circle cx="890" cy="180" r="120" fill="#ffffff" opacity=".35"/>
  <circle cx="240" cy="740" r="170" fill="#ffffff" opacity=".3"/>
  <rect x="450" y="180" width="300" height="520" rx="120" fill="url(#bottle)"/>
  <rect x="498" y="132" width="204" height="100" rx="40" fill="#3d3530"/>
  <rect x="480" y="270" width="240" height="300" rx="110" fill="#efebe5" opacity=".78"/>
  <text x="600" y="780" text-anchor="middle" font-family="Georgia, serif" font-size="64" fill="#7f3710">Aurora Bottle</text>
</svg>

