<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">桌燈示意圖</title>
  <desc id="desc">帶有暖色燈光的桌燈產品插圖。</desc>
  <defs>
    <linearGradient id="bg" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#f2ede5"/>
      <stop offset="100%" stop-color="#ddd1bd"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#ffe7b6" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#ffe7b6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <ellipse cx="590" cy="240" rx="250" ry="220" fill="url(#glow)"/>
  <rect x="400" y="210" width="380" height="270" rx="56" fill="#f8f1e5"/>
  <rect x="575" y="470" width="30" height="150" rx="12" fill="#7a5f44"/>
  <rect x="500" y="615" width="180" height="55" rx="22" fill="#8b6848"/>
  <ellipse cx="590" cy="670" rx="240" ry="54" fill="#c7b49c" opacity=".5"/>
  <text x="600" y="790" text-anchor="middle" font-family="Georgia, serif" font-size="64" fill="#7f3710">Linen Lamp</text>
</svg>

